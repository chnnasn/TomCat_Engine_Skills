[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tomcat-engine-skills"
version = "0.1.0"
description = "Python client, MCP adapter and modular Agent Skills for TomCat Engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
tomcat-skills = "tomcat_skills.client:main"
tomcat-mcp = "tomcat_skills.server:main"

[project.urls]
Repository = "https://github.com/chnnasn/TomCat_Engine_Skills"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/tomcat-engine-skills/skills/tomcat-editor" = ["skills/tomcat-editor/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-editor/references" = ["skills/tomcat-editor/references/physics2d.md"]
"share/tomcat-engine-skills/skills/tomcat-editor/scripts" = ["skills/tomcat-editor/scripts/tomcat.py"]
"share/tomcat-engine-skills/skills/tomcat-prefab" = ["skills/tomcat-prefab/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-runtime-ui" = ["skills/tomcat-runtime-ui/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-scene-streaming" = ["skills/tomcat-scene-streaming/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-profiler" = ["skills/tomcat-profiler/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-assets" = ["skills/tomcat-assets/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-animation" = ["skills/tomcat-animation/SKILL.md"]
"share/tomcat-engine-skills/skills/tomcat-tilemap" = ["skills/tomcat-tilemap/SKILL.md"]
